<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZCODE Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050806;
            overflow: hidden;
        }
        #editor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-family: 'monospace';
            font-size: 12px; /* font size 12 — keputusan tim (editor + terminal) */
            background-color: #050806 !important;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050806;
        }
        ::-webkit-scrollbar-thumb {
            background: #1B4D2E;
            border-radius: 2px;
        }
        /* True-black OLED — gutter soft, bukan garis tegas */
        .ace_gutter {
            background: #0A100D !important;
            color: #4D7A5A !important;
            border-right: 1px solid #111612 !important;
        }
        /* Gutter ramping (permintaan user): pangkas padding sel — Ace mengukur
           lebar gutter dari DOM (digit + padding), jadi padding kecil = kolom sempit */
        .ace_gutter-cell {
            padding-left: 6px !important;
            padding-right: 3px !important;
        }
        .ace_gutter-layer {
            min-width: 0 !important;
        }
        .ace_editor {
            background-color: #050806 !important;
        }
        .ace_scroller {
            background-color: #050806 !important;
        }
        .ace_active-line {
            background: rgba(27, 77, 46, 0.12) !important;
        }
        /* Handle "..." menu mobile Ace: dibuat semi-transparan agar tidak
           menutupi kode; menu yang terbuka tetap opacity penuh */
        .ace_mobile-menu .ace_mobile-button[action="more"] {
            opacity: 0.5;
        }
        /* Menu seleksi Ace (Select All/Find/Palette) mengikuti true-black OLED */
        .ace_mobile-menu {
            background: #101613 !important;
            border: 1px solid #1B4D2E !important;
        }

        /* ===== Fix gelap-di-gelap ext-prompt (Palette) + ext-searchbox (Find) =====
           Default ext-prompt: container `background: white`, editor batin default
           theme textmate (terang) → teks tak terbaca di atas OLED. Paksa gelap. */
        .ace_prompt_container {
            background: #101613 !important;
            border: 1px solid #1B4D2E !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.65) !important;
        }
        .ace_prompt_container .ace_editor,
        .ace_prompt_container .ace_scroller,
        .ace_prompt_container .ace_content,
        .ace_prompt_container .ace_text-layer {
            background: #0A100D !important;
            color: #E6EDF3 !important;
        }
        .ace_prompt_container .ace_line,
        .ace_prompt_container .ace_line span {
            color: #E6EDF3 !important;
        }
        .ace_prompt_container .ace_cursor {
            color: #39FF14 !important;
        }
        .ace_prompt_container .ace_selected,
        .ace_autocomplete .ace_selected {
            background: rgba(27, 77, 46, 0.55) !important;
        }
        .ace_prompt_container .ace_completion-highlight,
        .ace_autocomplete .ace_completion-highlight {
            color: #9ECE6A !important;
        }
        /* Popup autocomplete generik (di luar prompt container) */
        .ace_autocomplete {
            background: #101613 !important;
            border: 1px solid #1B4D2E !important;
            color: #D7DBE0 !important;
        }
        .ace_autocomplete .ace_editor,
        .ace_autocomplete .ace_content,
        .ace_autocomplete .ace_text-layer,
        .ace_autocomplete .ace_line,
        .ace_autocomplete .ace_line span {
            background: transparent !important;
            color: #D7DBE0 !important;
        }
        .ace_autocomplete .ace_emptyMessage {
            color: #8A9A90 !important;
        }
        /* Search box (Find) — default #ddd terang, selaraskan OLED */
        .ace_search {
            background-color: #101613 !important;
            color: #D7DBE0 !important;
            border: 1px solid #1B4D2E !important;
        }
        .ace_search_field,
        .ace_replace_field {
            background: #050806 !important;
            color: #E6EDF3 !important;
            border: 1px solid #1B4D2E !important;
        }
        .ace_searchbtn,
        .ace_replacebtn,
        .ace_button {
            color: #D7DBE0 !important;
        }
        .ace_nomatch {
            outline-color: #FF4B4B !important;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <script src="ace/ace.js"></script>
    <script src="ace/mode-python.js"></script>
    <script src="ace/theme-tomorrow_night_eighties.js"></script>
    <!-- ext v1.44.0 offline (offline-first): tanpa file ini tombol Find & Palette
         di menu seleksi mobile Ace mati — find loadModule("ace/ext/searchbox"),
         editor.prompt loadModule("ace/ext/prompt"). Nol overlap dengan ace.js core. -->
    <script src="ace/ext-searchbox.js"></script>
    <script src="ace/ext-prompt.js"></script>
    <script>
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.session.setUseWorker(false);

        editor.setOptions({
            fontSize: "12px",          // font size 12 (keputusan tim)
            showPrintMargin: false,
            showGutter: true,          // gutter dirampingkan via CSS .ace_gutter-cell + tanpa fold widgets
            showFoldWidgets: false,    // fold widget memperlebar gutter — dimatikan agar leluasa (permintaan user)
            highlightActiveLine: true,
            wrap: true,
            cursorStyle: "line",
            tabSize: 4,
            useSoftTabs: true,
            animatedScroll: false,
            enableBasicAutocompletion: false
        });

        var isSettingValue = false;

        editor.on("change", function () {
            if (!isSettingValue && window.ZCODE) {
                window.ZCODE.onCodeChange(editor.getValue());
            }
        });

        /* ---------- Kotlin bridge ---------- */
        function setCode(code) {
            isSettingValue = true;
            editor.setValue(code, -1);
            isSettingValue = false;
        }
        function getCode() {
            return editor.getValue();
        }
        function insertText(text) {
            editor.insert(text);
            editor.focus();
        }
        function undo() {
            editor.undo();
        }
        function redo() {
            editor.redo();
        }

        /* ---------- Plugin: Duplicate Active Line(s) ---------- */
        function duplicateRows() {
            var doc = editor.session.getDocument();
            var range = editor.getSelection().getRange();
            var start = range.start.row;
            var end = range.end.row;
            var lines = doc.getLines(start, end);
            if (!lines.length) return;
            var insertRow = end + 1;
            editor.session.insert({ row: insertRow, column: 0 }, lines.join("\n") + "\n");
        }

        /* ---------- Plugin: Toggle Line Comment ---------- */
        function toggleCommentLines() {
            var doc = editor.session.getDocument();
            var range = editor.getSelection().getRange();
            var start = range.start.row;
            var end = range.end.row;
            var lines = doc.getLines(start, end);
            if (!lines.length) return;

            var allCommented = lines.every(function (l) {
                return /^\s*#/.test(l);
            });

            var out = lines.map(function (l) {
                if (allCommented) {
                    // uncomment: hapus satu tanda # + satu spasi opsional
                    return l.replace(/^(\s*)#\s?/, "$1");
                }
                var indent = (l.match(/^(\s*)/) || ["", ""])[1];
                return indent + "# " + l.replace(/^\s*/, "");
            });

            var last = doc.getLine(end);
            range.end.column = last.length;
            range.start.column = 0;
            editor.session.replace(range, out.join("\n"));
            editor.selection.clearSelection();
        }

        if (window.ZCODE && typeof window.ZCODE.onEditorReady === "function") {
            window.ZCODE.onEditorReady();
        }
    </script>
</body>
</html>
