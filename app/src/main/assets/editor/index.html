<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ZCODE Editor</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050806;
            overflow: hidden;
        }
        #editor {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-family: 'monospace';
            font-size: 12px; /* font size 12 — keputusan tim (editor + terminal) */
            background-color: #050806;
        }
        #editor .cm-editor {
            height: 100%;
        }
        /* Scrollbar OLED — dipertahankan dari versi Ace (WebKit WebView) */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #050806;
        }
        ::-webkit-scrollbar-thumb {
            background: #1B4D2E;
            border-radius: 2px;
        }
        /* Semua styling editor (gutter #0A100D soft, active-line
           rgba(27,77,46,.12), selection, cursor #39FF14, panel Find,
           tooltip) kini deklaratif di dalam bundle (EditorView.theme) —
           tidak ada lagi hack CSS !important (migrasi CM6, lihat
           docs/MIGRASI_CM6.md). */
    </style>
</head>
<body>
    <div id="editor"></div>
    <!-- CodeMirror 6 bundle — GENERATED dari editor-src/ (esbuild, target
         es2018). Offline-first: single-file IIFE, tanpa CDN, tanpa module
         loader. Kontrak bridge identik dengan versi Ace: setCode, getCode,
         insertText, undo, redo, duplicateRows, toggleCommentLines +
         onEditorReady handshake (fix PR #5) + openFind (baru). -->
    <script src="codemirror.bundle.js"></script>
</body>
</html>
