name: Build ZCODE RC — v1.0.20-rc1

on:
  push:
    branches: [ "arena/v1020-rc1" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full local-equivalent gate
        run: |
          pip install --break-system-packages pillow pytest packaging
          bash tools/check.sh
          python3 tools/kotlin_sanity_check.py
          python3 tools/npm_supply_chain_check.py
          git diff --check

  build-rc:
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rc-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts', 'app/build.gradle.kts', 'app/proguard-rc.pro') }}

      - name: Build non-debuggable optimized RC APK
        run: |
          python3 --version
          set -o pipefail
          if gradle assembleRc --stacktrace --warning-mode all 2>&1 | tee rc-build.log; then
            echo "BUILD_RC_OK"
          else
            rc=${PIPESTATUS[0]}
            echo "BUILD_RC_FAILED rc=$rc"
            tail -n 250 rc-build.log
            exit "$rc"
          fi

      - name: Verify RC APK contract
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/rc -name "*.apk" -type f | head -n 1)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"

          "$AAPT" dump badging "$APK" | tee rc-badging.txt
          grep -q "package: name='com.zaba.zcode.rc'" rc-badging.txt
          grep -q "versionCode='23'" rc-badging.txt
          grep -q "versionName='1.0.20-rc1'" rc-badging.txt
          grep -q "application-label:'ZCODE RC'" rc-badging.txt
          if grep -q '^application-debuggable' rc-badging.txt; then
            echo "RC APK tidak boleh debuggable"
            exit 1
          fi

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee rc-manifest.txt
          grep -q 'com.zaba.zcode.rc' rc-manifest.txt
          grep -q ':rebirth' rc-manifest.txt
          grep -q 'profileable' rc-manifest.txt

          unzip -Z1 "$APK" > rc-apk-files.txt
          grep -q 'assets/editor/codemirror.bundle.js' rc-apk-files.txt
          grep -q 'assets/chaquopy' rc-apk-files.txt

          mkdir -p "$RUNNER_TEMP/zcode-rc-apk"
          cp "$APK" "$RUNNER_TEMP/zcode-rc-apk/ZCODE-v1.0.20-rc1.apk"
          (
            cd "$RUNNER_TEMP/zcode-rc-apk"
            sha256sum ZCODE-v1.0.20-rc1.apk > ZCODE-v1.0.20-rc1.apk.sha256
          )
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/zcode-rc-apk/apksigner.txt"

      - name: Upload one user-facing RC APK
        uses: actions/upload-artifact@v4
        with:
          name: ZCODE-v1.0.20-rc1
          path: ${{ runner.temp }}/zcode-rc-apk/*
          if-no-files-found: error

      - name: Collect R8 and build reports
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/zcode-rc-reports"
          cp rc-build.log "$RUNNER_TEMP/zcode-rc-reports/" 2>/dev/null || true
          cp rc-badging.txt "$RUNNER_TEMP/zcode-rc-reports/" 2>/dev/null || true
          cp rc-manifest.txt "$RUNNER_TEMP/zcode-rc-reports/" 2>/dev/null || true
          if [ -d app/build/outputs/mapping/rc ]; then
            cp -R app/build/outputs/mapping/rc "$RUNNER_TEMP/zcode-rc-reports/r8-mapping"
          fi

      - name: Upload technical R8 reports separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZCODE-v1.0.20-rc1-technical-reports
          path: ${{ runner.temp }}/zcode-rc-reports/*
          if-no-files-found: warn
          retention-days: 14
