name: Build ZCODE APK — Fase 1 & 2 (OLED, File Manager, PTY, Pip, Themes + Chaquopy 3.11)

on:
  push:
    branches:
      - main
      - "arena/**"
      # RC/production branches own optimized/release pipelines; never emit a
      # competing Debug APK from those pushes.
      - "!arena/v1020-rc1"
      - "!arena/v1020-production"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run strict tests (Fase 0 + Fase 1/2 + Package Runtime SPEC-001)
        run: |
          pip install --break-system-packages pillow pytest packaging
          python -m pytest test_zcode_fase0.py -v
          python -m pytest test_zcode_package_runtime.py -v
          bash tools/check.sh

  build:
    # Main uses the manually approved production workflow. RC/production PRs
    # keep canonical tests but do not build/upload a competing Debug APK.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.head_ref != 'arena/v1020-rc1' &&
       github.head_ref != 'arena/v1020-production')
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # WAJIB: Chaquopy 15 buildPython harus match major+minor versi Python app (3.11).
      # Runner ubuntu-22.04 default python3 = 3.10 → tanpa ini gradle assembleDebug
      # selalu gagal di task Chaquopy (akar kegagalan CI sesi sebelumnya).
      - name: Set up Python 3.11 (buildPython Chaquopy)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Validate and cache the pinned Gradle wrapper
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts', 'app/build.gradle.kts') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "no gradlew"

      - name: Build Debug APK (Fase 1 & 2)
        run: |
          python3 --version  # sanity: harus 3.11.x untuk Chaquopy
          set -o pipefail
          if ./gradlew testDebugUnitTest assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log; then
            echo "✅ BUILD OK"
            tail -n 100 build.log
          else
            rc=${PIPESTATUS[0]}
            echo "❌ BUILD FAILED (rc=$rc) — tail build.log:"
            tail -n 200 build.log
            exit $rc
          fi

      - name: Verify APK contains CodeMirror 6 + taskAffinity
        run: |
          ls -R app/build 2>&1 | head -n 50 || echo "no build dir"
          APK=$(find app/build -name "*.apk" 2>/dev/null | head -n 1)
          echo "APK: $APK"
          if [ -z "$APK" ]; then echo "❌ No APK found — build failed"; ls -lh app/build/outputs/apk/ 2>&1 | head -n 30; exit 1; fi
          ls -lh "$APK"
          unzip -l "$APK" | grep -i -E "codemirror.bundle.js|AndroidManifest" | head -n 20
          # Check manifest has taskAffinity (via aapt dump)
          $ANDROID_HOME/build-tools/34.0.0/aapt dump xmltree "$APK" AndroidManifest.xml | grep -i "taskAffinity" || echo "check taskAffinity in manifest"

      - name: Upload APK (Fase 1 & 2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ZCODE-Fase12-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: CI Summary
        if: always()
        run: |
          echo "### ZCODE Fase 1 & 2 Build — $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Topbar: faded grey #3A4452 ≡ + (no hamburger text)" >> $GITHUB_STEP_SUMMARY
          echo "- Editor: OLED #050806 CodeMirror 6 bundled file:// + gutter ramping" >> $GITHUB_STEP_SUMMARY
          echo "- QuickTools + FAB above handle, Drawer text-only, Contribute -> Issues" >> $GITHUB_STEP_SUMMARY
          echo "- PTY: ketik langsung di terminal (no stdin field), Chaquopy 3.11 arm64+armv7" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY || true

  compile-production-source:
    # Compiler evidence for every PR without assembling/uploading a second APK.
    # Do not gate on a session/release prefix: PR #28 used a Jules branch without
    # `arena/`, proving that even a prefix gate can silently skip future agents.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Validate and cache the pinned Gradle wrapper
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Compile production source without an APK
        run: |
          python3 --version
          ./gradlew :app:compileDebugKotlin testDebugUnitTest --stacktrace --warning-mode all
          git diff --check
