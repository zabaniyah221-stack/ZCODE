name: ZCODE Wheel Builder (SPEC-001 Phase 3)

# Membangun wheel Android untuk package native yang belum punya wheel di
# Chaquopy/pypi — memakai toolchain resmi Chaquopy (pip install chaquopy).
# Hasil: wheel per ABI (arm64-v8a, armeabi-v7a) untuk Python 3.11.
# Wheel yang dihasilkan bisa ditaruh di python-env/wheels (ZCODE wheel source).

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package(s) untuk dibangun (space-separated, format pip sdist URL atau 'name==version')"
        required: true
        default: "samples: https://github.com/chaquo/chaquopy/raw/master/demo/app/src/main/python/hello.py"
      python_version:
        description: "Versi Python target"
        required: false
        default: "3.11"

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      # Toolchain resmi Chaquopy untuk membangun C extension → wheel Android.
      # Dokumentasi: https://chaquo.com/chaquopy/doc/current/android.html#building-python-c-extensions
      - name: Install Chaquopy toolchain
        run: pip install chaquopy

      - name: Build wheels for ${{ matrix.abi }}
        run: |
          mkdir -p wheelhouse
          # catatan jujur: toolchain ini memerlukan NDK; lihat tools/wheel-builder/README.md
          # untuk langkah lengkap (NDK version, API level, flags).
          bash tools/wheel-builder/build_wheel.sh "${{ inputs.packages }}" ${{ matrix.abi }} wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: warn

  # Cek integritas: verifikasi wheel yang dihasilkan cocok dengan tag runtime
  # (dipakai unit test wheelinfo di test_zcode_package_runtime.py).
  verify:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
      - name: Verify wheel tags
        run: |
          pip install packaging
          python3 - <<'EOF'
          import glob, sys
          sys.path.insert(0, "app/src/main/python")
          from package_runtime.wheelinfo import parse_wheel
          for whl in glob.glob("wheelhouse/**/*.whl", recursive=True):
              info = parse_wheel(whl)
              print("OK", whl, info["tags"][:2])
          EOF
