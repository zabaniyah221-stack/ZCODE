name: zcode-desktop

on:
  push:
    branches: [arena/zcode-desktop]
  pull_request:
    branches: [arena/zcode-desktop]

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Compile desktop (no GUI run)
        run: gradle compileKotlin --stacktrace
