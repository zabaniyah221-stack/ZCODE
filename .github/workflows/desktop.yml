name: zcode-desktop

on:
  push:
    branches: [arena/zcode-desktop]
  pull_request:
    branches: [arena/zcode-desktop]

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Compile desktop (no GUI run)
        run: gradle compileKotlin --stacktrace
  package-deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build .deb
        run: gradle packageDeb --stacktrace
      - name: Locate .deb
        run: find build -name "*.deb" 2>/dev/null; ls -R build/compose/binaries 2>/dev/null | head -n 15
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
