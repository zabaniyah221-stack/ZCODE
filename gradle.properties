# ZCODE — Gradle properties
# Honest & aware: no magic, all pinned
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRResources=true
# RC1 mengadopsi R8 bertahap. Hapus hanya setelah targeted rules lulus CI +
# device UAT dan full-mode diuji sebagai eksperimen terpisah.
android.enableR8.fullMode=false
# Single source version (F-09 fix) — build.gradle.kts membaca property ini.
# Suffix -rc1 hanya hidup di build type rc.
zcode.versionName=1.0.21
zcode.versionCode=24
